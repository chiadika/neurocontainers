name: cgsense3d
version: 1.2.0

copyright:
  - license: MIT
    url: https://github.com/NeuroDesk/neurocontainers/blob/main/LICENSE

architectures:
  - x86_64

files:
  - name: cgsense3d.py
    filename: cgsense3d.py
  - name: gradwarp.py
    filename: gradwarp.py
  - name: mrdrecon.py
    filename: mrdrecon.py
  - name: run_local.py
    filename: run_local.py
  - name: twix2mrd.py
    filename: twix2mrd.py
  - name: siemens_twix2mrd.py
    filename: siemens_twix2mrd.py
  - name: mrd2nifti.py
    filename: mrd2nifti.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
  - name: radial3d_trajectory
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/radial3d_n6434_trajectory.h5
  - name: radial3d_res128_nyquist
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/radial3d_res128_nyquist_trajectory.h5
  - name: radial3d_res128_us2x
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/radial3d_res128_us2x_trajectory.h5
  - name: cones3d_n68785
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/cones3d_n68785_trajectory.h5
  - name: cones3d_n34506
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/cones3d_n34506_trajectory.h5
  - name: cones3d_n4846
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/cones3d_n4846_trajectory.h5
  - name: cones3d_n9598
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/cones3d_n9598_trajectory.h5
  - name: cones3d_n206435
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/cones3d_n206435_trajectory.h5
  - name: cones3d_n412489
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/cones3d_n412489_trajectory.h5
  - name: cones3d_n34506_ir32
    url: https://github.com/chiadika/neurocontainers/releases/download/quickgrid-trajectories-v1/cones3d_n34506_ir32_trajectory.h5

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - bzip2
        - ca-certificates
        - git
        - build-essential
        - python3-pip
        - python-is-python3
    - include: macros/openrecon/neurodocker.yaml
    - run:
        - ldconfig
    - run:
        - pip3 install --no-cache-dir sigpy==0.1.27 twixtools==0.24
    - workdir: /opt/cgsense3d
    - run:
        - cp {{ get_file("cgsense3d.py") }} /opt/code/python-ismrmrd-server/cgsense3d.py
        - cp {{ get_file("gradwarp.py") }} /opt/code/python-ismrmrd-server/gradwarp.py
        - cp {{ get_file("mrdrecon.py") }} /opt/code/python-ismrmrd-server/mrdrecon.py
        - cp {{ get_file("run_local.py") }} /opt/code/python-ismrmrd-server/run_local.py
        - cp {{ get_file("twix2mrd.py") }} /opt/code/python-ismrmrd-server/twix2mrd.py
        - cp {{ get_file("siemens_twix2mrd.py") }} /opt/code/python-ismrmrd-server/siemens_twix2mrd.py
        - cp {{ get_file("mrd2nifti.py") }} /opt/code/python-ismrmrd-server/mrd2nifti.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/cgsense3d/OpenReconREADME.md
    - run:
        - cp {{ get_file("radial3d_trajectory") }} /opt/cgsense3d/radial3d_n6434_trajectory.h5
        - cp {{ get_file("radial3d_res128_nyquist") }} /opt/cgsense3d/radial3d_res128_nyquist_trajectory.h5
        - cp {{ get_file("radial3d_res128_us2x") }} /opt/cgsense3d/radial3d_res128_us2x_trajectory.h5
        - cp {{ get_file("cones3d_n68785") }} /opt/cgsense3d/cones3d_n68785_trajectory.h5
        - cp {{ get_file("cones3d_n34506") }} /opt/cgsense3d/cones3d_n34506_trajectory.h5
        - cp {{ get_file("cones3d_n4846") }} /opt/cgsense3d/cones3d_n4846_trajectory.h5
        - cp {{ get_file("cones3d_n9598") }} /opt/cgsense3d/cones3d_n9598_trajectory.h5
        - cp {{ get_file("cones3d_n206435") }} /opt/cgsense3d/cones3d_n206435_trajectory.h5
        - cp {{ get_file("cones3d_n412489") }} /opt/cgsense3d/cones3d_n412489_trajectory.h5
        - cp {{ get_file("cones3d_n34506_ir32") }} /opt/cgsense3d/cones3d_n34506_ir32_trajectory.h5

deploy:
  bins:
    - python
    - siemens_to_ismrmrd

categories:
  - image reconstruction
icon: "data:image/png;base64,"

readme: |-
  ----------------------------------
  ## cgsense3d/{{ context.version }} ##
  CG-SENSE reconstruction for 3D radial and cones Pulseq acquisitions, with
  ESPIRiT coil sensitivity estimation and a Toeplitz-accelerated normal
  operator. The iterative counterpart of quickgrid: same scanner handoff,
  trajectories, echo splitting, orientation and distortion correction, but the
  image is the regularised least-squares solution instead of a gridding image,
  so undersampling aliasing is unfolded with the coil sensitivities.

  Since 1.2.0 it carries everything quickgrid gained up to 1.2.6: the full
  bundled trajectory set (three 3D radial, six 3D cones incl. the 512^3 and the
  IR-prepared random-order set, fetched from the quickgrid-trajectories-v1
  release), `trajectoryfile: auto` matched by shape and on the whole stream
  when `echosplit` splits a multi-echo acquisition, a stored DCF cut to the
  rows an echo or a short scan uses, the full-permutation `orientation` keys
  with `xyz` as default for the Terra.X Pulseq interpreter, and in-recon
  gradient-nonlinearity correction (`gradunwarp`) from the scanner's Siemens
  coefficient file read from `fire\share` (never bundled).

  Reconstruct offline without a scanner:
  ```bash
  python /opt/code/python-ismrmrd-server/run_local.py raw.h5 -o recon.nii.gz -m cgsense3d
  ```

  Build the recipe with:
  ```bash
  source env/bin/activate
  python -m builder generate cgsense3d --recreate --architecture x86_64
  sf-build cgsense3d --architecture x86_64
  ```

  Runtime notes are documented in `recipes/cgsense3d/OpenReconREADME.md`.
  ----------------------------------
