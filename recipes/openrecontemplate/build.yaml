name: openrecontemplate
version: 1.0.0

copyright:
  - license: MIT
    url: https://github.com/NeuroDesk/neurocontainers/blob/main/LICENSE

architectures:
  - x86_64

files:
  - name: openrecontemplate.py
    filename: openrecontemplate.py
  - name: mrdrecon.py
    filename: mrdrecon.py
  - name: example_cgsense.py
    filename: example_cgsense.py
  - name: run_local.py
    filename: run_local.py
  - name: twix2mrd.py
    filename: twix2mrd.py
  - name: siemens_twix2mrd.py
    filename: siemens_twix2mrd.py
  - name: mrd2nifti.py
    filename: mrd2nifti.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
  - name: sodium_trajectory_n50
    url: https://object-store.rc.nectar.org.au/v1/AUTH_dead991e1fa847e3afcca2d3a7041f5d/build/23Na_n50_trajectory.h5
  - name: sodium_trajectory_n28
    url: https://object-store.rc.nectar.org.au/v1/AUTH_dead991e1fa847e3afcca2d3a7041f5d/build/23Na_n28_trajectory.h5

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        NUMBA_CACHE_DIR: /tmp/numba-openrecontemplate
    - install:
        - bzip2
        - ca-certificates
        - git
        - build-essential
        - python3-pip
        - python-is-python3
    - include: macros/openrecon/neurodocker.yaml
    - run:
        - ldconfig
    # sigpy covers NUFFT/CG-SENSE; numba and pyFFTW are here so a hand-written
    # gridding kernel can be dropped in; SimpleITK provides N4.
    - run:
        - pip3 install --no-cache-dir sigpy==0.1.27 numba==0.66.0 pyFFTW==0.15.0 SimpleITK==2.5.5 twixtools==0.24
    - workdir: /opt/openrecontemplate
    - run:
        - cp {{ get_file("openrecontemplate.py") }} /opt/code/python-ismrmrd-server/openrecontemplate.py
        - cp {{ get_file("mrdrecon.py") }} /opt/code/python-ismrmrd-server/mrdrecon.py
        - cp {{ get_file("example_cgsense.py") }} /opt/code/python-ismrmrd-server/example_cgsense.py
        - cp {{ get_file("run_local.py") }} /opt/code/python-ismrmrd-server/run_local.py
        - cp {{ get_file("twix2mrd.py") }} /opt/code/python-ismrmrd-server/twix2mrd.py
        - cp {{ get_file("siemens_twix2mrd.py") }} /opt/code/python-ismrmrd-server/siemens_twix2mrd.py
        - cp {{ get_file("mrd2nifti.py") }} /opt/code/python-ismrmrd-server/mrd2nifti.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/openrecontemplate/OpenReconREADME.md
    - run:
        - cp {{ get_file("sodium_trajectory_n50") }} /opt/openrecontemplate/23Na_n50_trajectory.h5
        - cp {{ get_file("sodium_trajectory_n28") }} /opt/openrecontemplate/23Na_n28_trajectory.h5

deploy:
  bins:
    - python
    - siemens_to_ismrmrd

categories:
  - image reconstruction
icon: "data:image/png;base64,"

readme: |-
  ----------------------------------
  ## openrecontemplate/{{ context.version }} ##
  A starting point for writing your own OpenRecon reconstruction. All the
  ISMRMRD plumbing lives in `mrdrecon.py`; you write one function,
  `reconstruct()`, in `openrecontemplate.py`.

  The shipped algorithm is a density-compensated adjoint NUFFT, so the container
  reconstructs out of the box. `example_cgsense.py` shows the same pipeline
  solving an iterative CG-SENSE problem instead.

  Iterate offline without a scanner:
  ```bash
  python /opt/code/python-ismrmrd-server/run_local.py raw.h5 -o recon.nii.gz
  ```

  Build the recipe with:
  ```bash
  source env/bin/activate
  python -m builder generate openrecontemplate --recreate --architecture x86_64
  ```

  Full build:
  ```bash
  source env/bin/activate
  sf-build openrecontemplate --architecture x86_64
  ```

  Runtime notes are documented in `recipes/openrecontemplate/OpenReconREADME.md`.
  ----------------------------------
