name: quickgrid
version: 1.1.0

copyright:
  - license: MIT
    url: https://github.com/NeuroDesk/neurocontainers/blob/main/LICENSE

architectures:
  - x86_64

files:
  - name: quickgrid.py
    filename: quickgrid.py
  - name: mrdrecon.py
    filename: mrdrecon.py
  - name: run_local.py
    filename: run_local.py
  - name: twix2mrd.py
    filename: twix2mrd.py
  - name: siemens_twix2mrd.py
    filename: siemens_twix2mrd.py
  - name: mrd2nifti.py
    filename: mrd2nifti.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
  - name: radial3d_trajectory
    filename: radial3d_n6434_trajectory.h5
  - name: radial3d_res128_nyquist
    filename: radial3d_res128_nyquist_trajectory.h5
  - name: radial3d_res128_us2x
    filename: radial3d_res128_us2x_trajectory.h5
  - name: cones3d_n4846
    filename: cones3d_n4846_trajectory.h5
  - name: cones3d_n9598
    filename: cones3d_n9598_trajectory.h5
  - name: cones3d_n68785
    filename: cones3d_n68785_trajectory.h5
  - name: cones3d_n34506
    filename: cones3d_n34506_trajectory.h5

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
    - install:
        - bzip2
        - ca-certificates
        - git
        - build-essential
        - python3-pip
        - python-is-python3
    - include: macros/openrecon/neurodocker.yaml
    - run:
        - ldconfig
    - run:
        - pip3 install --no-cache-dir sigpy==0.1.27 twixtools==0.24
    - workdir: /opt/quickgrid
    - run:
        - cp {{ get_file("quickgrid.py") }} /opt/code/python-ismrmrd-server/quickgrid.py
        - cp {{ get_file("mrdrecon.py") }} /opt/code/python-ismrmrd-server/mrdrecon.py
        - cp {{ get_file("run_local.py") }} /opt/code/python-ismrmrd-server/run_local.py
        - cp {{ get_file("twix2mrd.py") }} /opt/code/python-ismrmrd-server/twix2mrd.py
        - cp {{ get_file("siemens_twix2mrd.py") }} /opt/code/python-ismrmrd-server/siemens_twix2mrd.py
        - cp {{ get_file("mrd2nifti.py") }} /opt/code/python-ismrmrd-server/mrd2nifti.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/quickgrid/OpenReconREADME.md
    - run:
        - cp {{ get_file("radial3d_trajectory") }} /opt/quickgrid/radial3d_n6434_trajectory.h5
        - cp {{ get_file("radial3d_res128_nyquist") }} /opt/quickgrid/radial3d_res128_nyquist_trajectory.h5
        - cp {{ get_file("radial3d_res128_us2x") }} /opt/quickgrid/radial3d_res128_us2x_trajectory.h5
        - cp {{ get_file("cones3d_n4846") }} /opt/quickgrid/cones3d_n4846_trajectory.h5
        - cp {{ get_file("cones3d_n9598") }} /opt/quickgrid/cones3d_n9598_trajectory.h5
        - cp {{ get_file("cones3d_n68785") }} /opt/quickgrid/cones3d_n68785_trajectory.h5
        - cp {{ get_file("cones3d_n34506") }} /opt/quickgrid/cones3d_n34506_trajectory.h5

deploy:
  bins:
    - python
    - siemens_to_ismrmrd

categories:
  - image reconstruction
icon: "data:image/png;base64,"

readme: |-
  ----------------------------------
  ## quickgrid/{{ context.version }} ##
  Fast gridding reconstruction (adjoint NUFFT + density compensation + coil
  combination) for 3D radial and cones Pulseq acquisitions. Built for quick
  scanner-side testing of a sequence, its trajectory and the FIRE handoff.

  Bundled trajectories: three 3D radial sets (32^3 original, 128^3 Nyquist,
  128^3 2x undersampled) and four 3D cones sets (220 mm R=2 and R=1; 250 mm
  256^3 TE 50 us R=1 and R=2) that ship a precomputed Pipe-Menon DCF.
  `trajectoryfile: auto` matches by shape, and also searches `fire\share`
  (mounted as /tmp/share) for `*_trajectory.h5`, which is where the 512^3
  trajectories go. Coils are gridded in parallel processes (`maxworkers`).

  Reconstruct offline without a scanner:
  ```bash
  python /opt/code/python-ismrmrd-server/run_local.py raw.h5 -o recon.nii.gz -m quickgrid
  ```

  Runtime notes are documented in `recipes/quickgrid/OpenReconREADME.md`.
  ----------------------------------
