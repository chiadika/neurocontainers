# cgsense3d container test suite
# Verifies OpenRecon runtime assets, the bundled trajectories, the Toeplitz
# fast path against the direct operator, an end-to-end CG-SENSE recon, the
# cones DCF path, the echo split, and the gradient-nonlinearity correction.

name: cgsense3d
version: 1.2.0
default_timeout: 900

tests:
  - name: OpenRecon runtime assets
    description: The server, app module, framework, label and README are in place
    script: |
      test -f /opt/code/python-ismrmrd-server/main.py
      test -f /opt/code/python-ismrmrd-server/cgsense3d.py
      test -f /opt/code/python-ismrmrd-server/mrdrecon.py
      test -f /opt/code/python-ismrmrd-server/gradwarp.py
      test -f /opt/code/python-ismrmrd-server/OpenReconLabel.json
      test -f /opt/cgsense3d/OpenReconREADME.md
      python -c "import json; json.load(open('/opt/code/python-ismrmrd-server/OpenReconLabel.json'))"
      echo "assets OK"

  - name: Trajectory assets and label
    description: Every bundled trajectory is readable, has distinct shape, cones carry a matching dcf, label is within the 14-parameter cap and agrees with the module defaults
    script: |
      cd /opt/code/python-ismrmrd-server && python - <<'PY'
      import json, h5py, numpy as np, cgsense3d
      from pathlib import Path
      shapes = {}
      for key, path in cgsense3d.BUNDLED_TRAJECTORIES.items():
          with h5py.File(path, "r") as h:
              k = h["k"]; shapes[key] = k.shape[:2]
              assert k.shape[-1] == 3, (key, k.shape)
              if key.startswith("cones"):
                  assert "dcf" in h and h["dcf"].shape == k.shape[:2], (key, list(h))
                  assert np.all(np.isfinite(h["dcf"][...])) and h["dcf"][...].min() >= 0
              print("  %-24s k%s%s" % (key, k.shape, "  +dcf" if "dcf" in h else ""))
      assert len(set(shapes.values())) == len(shapes), "auto-selection needs distinct shapes"
      for key, path in cgsense3d.NAMED_TRAJECTORIES.items():      # bundled, selectable by name, excluded from auto
          with h5py.File(path, "r") as h:
              assert "dcf" in h and "acq_order" in h and h["dcf"].shape == h["k"].shape[:2], key
              order = h["acq_order"][...].ravel()
              assert len(set(order.tolist())) == h["k"].shape[1], "acq_order must be a permutation"
              print("  %-24s k%s  +dcf +acq_order (named only)" % (key, h["k"].shape))
      label = json.loads(Path("OpenReconLabel.json").read_text())
      params = {p["id"]: p for p in label["parameters"]}
      assert len(params) <= 14, len(params)
      assert params["config"]["default"] == "cgsense3d"
      for pid, p in params.items():
          assert pid in cgsense3d.DEFAULTS, pid
          if p["type"] == "choice":
              assert p["default"] in [v["id"] for v in p["values"]], pid
          a, b = p["default"], cgsense3d.DEFAULTS[pid]
          try:
              same = float(a) == float(b)
          except (TypeError, ValueError):
              same = str(a).lower() == str(b).lower()
          assert same, (pid, a, b)
      choices = {v["id"] for v in params["trajectoryfile"]["values"]}
      assert set(cgsense3d.BUNDLED_TRAJECTORIES.values()) <= choices, choices
      assert set(cgsense3d.NAMED_TRAJECTORIES.values()) <= choices, choices
      print("label OK: %d parameters" % len(params))
      PY

  - name: Modules import and framework is configured
    description: The app module registers itself with the shared framework and installs the distortion-correction hook
    script: |
      cd /opt/code/python-ismrmrd-server && python - <<'PY'
      import cgsense3d, mrdrecon, gradwarp, sigpy, sigpy.mri, twixtools  # noqa: F401
      assert callable(cgsense3d.reconstruct) and callable(cgsense3d.process)
      assert mrdrecon.RECON_NAME == "cgsense3d"
      assert mrdrecon.OPENRECON_DEFAULTS["matrixsize"] == 128
      assert mrdrecon.OPENRECON_DEFAULTS["maxcoils"] == 0
      assert mrdrecon.OPENRECON_DEFAULTS["orientation"] == "xyz"
      assert mrdrecon.OPENRECON_DEFAULTS["echosplit"] == 1
      assert cgsense3d.gradient_unwarp in mrdrecon.OUTPUT_VOLUME_HOOKS
      assert "/opt/cgsense3d" in gradwarp.COEFF_SEARCH_DIRS
      assert mrdrecon.EMIT_VOLUME_AS_SINGLE_IMAGE is False
      print(cgsense3d.__file__)
      PY

  - name: Toeplitz operator matches the direct operator
    description: The fast normal operator must agree with two NUFFTs per coil, or CG solves the wrong system
    script: |
      cd /opt/code/python-ismrmrd-server && python - <<'PY'
      import numpy as np, cgsense3d

      N, coils, pts = 16, 3, 3000
      rng = np.random.default_rng(0)
      coord = rng.uniform(-N/2, N/2, (pts, 3)).astype(np.float32)
      w = np.abs(rng.standard_normal(pts)).astype(np.float32)
      maps = (rng.standard_normal((coils,)+(N,)*3) + 1j*rng.standard_normal((coils,)+(N,)*3)).astype(np.complex64)
      x = (rng.standard_normal((N,)*3) + 1j*rng.standard_normal((N,)*3)).astype(np.complex64)

      fast = cgsense3d.build_normal_operator(maps, coord, w, (N,)*3, 0.0, use_toeplitz=True)
      slow = cgsense3d.build_normal_operator(maps, coord, w, (N,)*3, 0.0, use_toeplitz=False)
      a, b = fast(x), slow(x)
      err = np.linalg.norm(a - b) / np.linalg.norm(b)
      print("Toeplitz vs direct relative error: %.3e" % err)
      assert err < 5e-2, err
      # threaded coil loop is bit-identical to the serial one
      fast4 = cgsense3d.build_normal_operator(maps, coord, w, (N,)*3, 0.0, use_toeplitz=True, max_workers=4)
      assert np.array_equal(fast4(x), a), "worker count must not change the result"

      # The normal operator must be Hermitian positive definite for CG to work.
      y = (rng.standard_normal((N,)*3) + 1j*rng.standard_normal((N,)*3)).astype(np.complex64)
      herm = abs(np.vdot(fast(x), y) - np.vdot(x, fast(y))) / abs(np.vdot(fast(x), y))
      print("Hermitian symmetry error: %.3e" % herm)
      assert herm < 1e-3, herm
      assert np.vdot(x, fast(x)).real > 0
      PY

  - name: End-to-end CG-SENSE on the bundled radial trajectory
    description: Reconstruct a simulated multi-coil phantom through the real 32^3 trajectory and check it against ground truth
    script: |
      cd /opt/code/python-ismrmrd-server && python - <<'PY'
      import numpy as np, h5py, sigpy, mrdrecon, cgsense3d, time
      with h5py.File(cgsense3d.BUNDLED_TRAJECTORIES["radial3d_n6434"], "r") as h:
          traj = h["k"][:]
      N, fov, coils = 32, 22.0, 4
      g = np.stack(np.meshgrid(*[np.linspace(-1, 1, N)]*3, indexing="ij"))
      r = np.linalg.norm(g, axis=0)
      truth = ((r < 0.7).astype(np.float32) + 0.6*(np.abs(g[0]) < 0.2)*(r < 0.7)).astype(np.float32)
      mps = np.stack([np.exp(-((g[i % 3] - (0.6 if i < 2 else -0.6))**2)).astype(np.float32)
                      for i in range(coils)]).astype(np.complex64)
      coord = (traj.reshape(-1, 3) * fov).astype(np.float32)
      y = sigpy.nufft(mps * truth[None], coord).reshape(coils, traj.shape[0], traj.shape[1]).astype(np.complex64)
      recon = mrdrecon.ReconInput(
          kspace=y, trajectory=traj, raw_kspace=np.transpose(y, (0, 2, 1)),
          matrix_size=N, fov_cm=fov, config=dict(cgsense3d.DEFAULTS, cgiterations=8, espiritmatrix=16),
          metadata=None, trajectory_source=cgsense3d.BUNDLED_TRAJECTORIES["radial3d_n6434"], max_workers=4)
      t0 = time.time(); vol = cgsense3d.reconstruct(recon); dt = time.time() - t0
      assert vol.shape == (N, N, N) and vol.dtype == np.float32 and np.all(np.isfinite(vol))
      corr = np.corrcoef(vol.ravel(), truth.ravel())[0, 1]
      print("CG-SENSE %.1fs, correlation with the phantom %.3f" % (dt, corr))
      assert corr > 0.9, corr
      PY

  - name: Cones uses its shipped DCF, cut to the rows an echo uses
    description: The precomputed dcf is picked up for cones instead of a slow Pipe-Menon run, and follows a row selection
    script: |
      cd /opt/code/python-ismrmrd-server && python - <<'PY'
      import numpy as np, h5py, mrdrecon, cgsense3d
      path = cgsense3d.BUNDLED_TRAJECTORIES["cones3d_n4846"]
      with h5py.File(path, "r") as h:
          traj = h["k"][:]; dcf = h["dcf"][...]
      recon = mrdrecon.ReconInput(
          kspace=np.zeros((1,) + traj.shape[:2], np.complex64), trajectory=traj,
          raw_kspace=np.zeros((1, traj.shape[1], traj.shape[0]), np.complex64),
          matrix_size=134, fov_cm=22.0, config=dict(cgsense3d.DEFAULTS, dcfmode="auto"),
          metadata=None, trajectory_source=path)
      w = cgsense3d.density_compensation(recon)
      assert w.shape == (traj.size // 3,) and np.allclose(w, dcf.ravel())
      rows = np.arange(0, traj.shape[1], 2)                       # echo 1 of an alternating pair
      sel = dict(swapped=False, rows=rows, sample_offset=0, samples=traj.shape[0], readouts=rows.size)
      recon = mrdrecon.ReconInput(
          kspace=np.zeros((1, traj.shape[0], rows.size), np.complex64), trajectory=traj[:, rows],
          raw_kspace=np.zeros((1, rows.size, traj.shape[0]), np.complex64),
          matrix_size=134, fov_cm=22.0, config=dict(cgsense3d.DEFAULTS, dcfmode="auto"),
          metadata=None, trajectory_source=path, trajectory_selection=sel)
      w2 = cgsense3d.density_compensation(recon)
      assert np.array_equal(w2.reshape(traj.shape[0], rows.size), dcf[:, rows])
      print("cones dcf: %d weights from file, %d after the echo row selection" % (w.size, w2.size))
      PY

  - name: Echo split and whole-stream trajectory matching
    description: Alternating-echo streams split by parity onto their own trajectory rows, and the trajectory is identified on the whole stream
    script: |
      cd /opt/code/python-ismrmrd-server && python - <<'PY'
      import numpy as np, mrdrecon, cgsense3d  # noqa: F401
      from types import SimpleNamespace
      def acqs(counters):
          out = []
          for c in counters:
              head = SimpleNamespace(scan_counter=int(c), idx=SimpleNamespace(contrast=0))
              out.append(SimpleNamespace(getHead=lambda h=head: h))
          return out
      groups = mrdrecon.split_acquisitions_by_echo(acqs(range(1, 7)), 2)
      assert list(mrdrecon._echo_trajectory_rows(groups[0]["global_indices"], 2, 6, 6)) == [0, 2, 4]
      assert list(mrdrecon._echo_trajectory_rows(groups[1]["global_indices"], 2, 6, 6)) == [1, 3, 5]
      assert list(mrdrecon._echo_trajectory_rows(groups[0]["global_indices"], 2, 6, 3)) == [0, 1, 2]
      assert mrdrecon._stream_vs_trajectory(11352, 2, 11352) == ("exact", 1)
      assert mrdrecon._stream_vs_trajectory(11352, 2, 5728) == ("short", 2, 104)
      assert mrdrecon._stream_vs_trajectory(5248, 1, 11352) is None
      print("echosplit OK")
      PY

  - name: Gradient-nonlinearity correction on a synthetic coefficient set
    description: The bundled gradwarp module parses a Siemens-format .grad file, leaves a volume untouched for linear-only coefficients, and undoes a known warp
    script: |
      cd /opt/code/python-ismrmrd-server && python - <<'PY'
      import numpy as np, scipy.ndimage, gradwarp, tempfile, os
      rng = np.random.default_rng(7)
      lines = ["# synthetic", " 0.250 m = R0"]; k = 1
      for ax in "xyz":
          for n in range(2, 8):
              for m in range(0, n + 1):
                  for ab in ("A", "B"):
                      if ab == "B" and m == 0: continue
                      lines.append("%3d %s(%2d,%2d) %12.7f %s" % (k, ab, n, m, 0.02 * rng.standard_normal() / (n * n), ax)); k += 1
      d = tempfile.mkdtemp(); f = os.path.join(d, "coeff_TEST.grad"); open(f, "w").write("\n".join(lines) + "\n")
      c = gradwarp.read_siemens_grad(f); assert c.order == 7 and c.R0_m == 0.25
      lin = os.path.join(d, "coeff_LIN.grad"); open(lin, "w").write("#\n 0.250 m = R0\n  1 A( 1, 1)  0.0000000 x\n")
      vol = rng.random((24, 20, 22)).astype(np.float32)
      out = gradwarp.unwarp_volume(vol, gradwarp.read_siemens_grad(lin), [0, 0, 0], np.eye(3), [2.0] * 3)
      assert np.allclose(out, vol, atol=1e-5), "linear-only coefficients must be the identity"
      n, sp = 48, 4.0; g = (np.arange(n) - (n - 1) / 2) * sp
      S, R, C = np.meshgrid(g, g, g, indexing="ij")
      truth = (np.exp(-((S / 60) ** 2 + (R / 50) ** 2 + (C / 70) ** 2)) * (1 + 0.3 * np.cos(S / 15) * np.cos(C / 12))).astype(np.float32)
      dv = gradwarp.displacement_lps(c, np.stack([S, R, C], -1))
      acquired = scipy.ndimage.map_coordinates(truth, np.stack([S, R, C]) / sp + (n - 1) / 2 - np.moveaxis(dv, -1, 0) / sp, order=1)
      corrected = gradwarp.unwarp_volume(acquired, c, [0, 0, 0], np.eye(3), [sp] * 3, jacobian=False)
      i = (slice(6, -6),) * 3
      before, after = np.abs(acquired - truth)[i].mean(), np.abs(corrected - truth)[i].mean()
      assert after < 0.35 * before, (before, after)
      print("gradwarp OK: |dv|max %.2f mm, residual %.1f%% of the uncorrected error" % (np.abs(dv).max(), 100 * after / before))
      PY
