name: pnpdrunet
version: 1.1.0

copyright:
  - license: MIT
    url: https://github.com/NeuroDesk/neurocontainers/blob/main/LICENSE
  - license: MIT
    url: https://github.com/cszn/DPIR/blob/master/LICENSE

architectures:
  - x86_64

files:
  - name: pnpdrunet.py
    filename: pnpdrunet.py
  - name: reconops.py
    filename: reconops.py
  - name: drunet.py
    filename: drunet.py
  - name: mrdrecon.py
    filename: mrdrecon.py
  - name: run_local.py
    filename: run_local.py
  - name: twix2mrd.py
    filename: twix2mrd.py
  - name: siemens_twix2mrd.py
    filename: siemens_twix2mrd.py
  - name: mrd2nifti.py
    filename: mrd2nifti.py
  - name: OpenReconLabel.json
    filename: OpenReconLabel.json
  - name: OpenReconREADME.md
    filename: OpenReconREADME.md
  - name: radial3d_res128_nyquist
    filename: radial3d_res128_nyquist_trajectory.h5
  - name: radial3d_res128_us2x
    filename: radial3d_res128_us2x_trajectory.h5
  - name: radial3d_n6434
    filename: radial3d_n6434_trajectory.h5
  - name: drunet_gray_checkpoint
    url: https://github.com/cszn/KAIR/releases/download/v1.0/drunet_gray.pth

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt

  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive
        OMP_NUM_THREADS: "8"
    - install:
        - bzip2
        - ca-certificates
        - git
        - build-essential
        - python3-pip
        - python-is-python3
    - include: macros/openrecon/neurodocker.yaml
    - run:
        - ldconfig
    - run:
        - pip3 install --no-cache-dir sigpy==0.1.27 twixtools==0.24
    # CUDA 11.8 build: OpenRecon caps CUDA at 11.8, and cu118 wheels bundle
    # their own runtime, so only a >= 11.8-capable driver is needed on the host.
    # The app verifies the device with a real kernel at startup and falls back
    # to CPU if anything is wrong, so this image still runs on a GPU-less host.
    - run:
        - pip3 install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
    - workdir: /opt/pnpdrunet
    - run:
        - cp {{ get_file("pnpdrunet.py") }} /opt/code/python-ismrmrd-server/pnpdrunet.py
        - cp {{ get_file("reconops.py") }} /opt/code/python-ismrmrd-server/reconops.py
        - cp {{ get_file("drunet.py") }} /opt/code/python-ismrmrd-server/drunet.py
        - cp {{ get_file("mrdrecon.py") }} /opt/code/python-ismrmrd-server/mrdrecon.py
        - cp {{ get_file("run_local.py") }} /opt/code/python-ismrmrd-server/run_local.py
        - cp {{ get_file("twix2mrd.py") }} /opt/code/python-ismrmrd-server/twix2mrd.py
        - cp {{ get_file("siemens_twix2mrd.py") }} /opt/code/python-ismrmrd-server/siemens_twix2mrd.py
        - cp {{ get_file("mrd2nifti.py") }} /opt/code/python-ismrmrd-server/mrd2nifti.py
        - cp {{ get_file("OpenReconLabel.json") }} /opt/code/python-ismrmrd-server/OpenReconLabel.json
        - cp {{ get_file("OpenReconREADME.md") }} /opt/pnpdrunet/OpenReconREADME.md
    - run:
        - cp {{ get_file("radial3d_res128_nyquist") }} /opt/pnpdrunet/radial3d_res128_nyquist_trajectory.h5
        - cp {{ get_file("radial3d_res128_us2x") }} /opt/pnpdrunet/radial3d_res128_us2x_trajectory.h5
        - cp {{ get_file("radial3d_n6434") }} /opt/pnpdrunet/radial3d_n6434_trajectory.h5
        - cp {{ get_file("drunet_gray_checkpoint") }} /opt/pnpdrunet/drunet_gray.pth

deploy:
  bins:
    - python
    - siemens_to_ismrmrd

categories:
  - image reconstruction
  - machine learning
icon: "data:image/png;base64,"

readme: |-
  ----------------------------------
  ## pnpdrunet/{{ context.version }} ##
  Plug-and-play 3D radial reconstruction with a DRUNet denoiser prior, using
  half-quadratic splitting. The data sub-problem reuses the Toeplitz-accelerated
  CG-SENSE operator from `cgsense3d`; the prior sub-problem is one DRUNet pass.

  Learned regularisation that fits a scanner time budget: this needs ~6 network
  evaluations, where diffusion posterior sampling needs ~1000.

  Research use only. DRUNet was trained on natural grayscale images, not MR
  data, so the prior shapes the image in ways the acquisition does not
  constrain. Compare against `cgsense3d` before trusting any structure.

  Reconstruct offline without a scanner:
  ```bash
  python /opt/code/python-ismrmrd-server/run_local.py raw.h5 -o recon.nii.gz -m pnpdrunet
  ```

  Runtime notes are documented in `recipes/pnpdrunet/OpenReconREADME.md`.
  ----------------------------------
